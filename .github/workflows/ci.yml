name: ci.yml
on: push

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
      - name: Check generated files
        run: |
          go generate ./...
          git add -N .
          git diff --exit-code
      - name: Check formatting
        run: test -z $(gofmt -l .)
      - name: Test
        uses: robherley/go-test-action@2f859e0c8769d755d3174eecb9af8f64660827f3 # v1.1.0
