name: ci.yml
on: push

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
      - name: Check generated files
        run: |
          go generate ./...
          git add -N .
          git diff --exit-code
      - name: Check formatting
        run: test -z $(gofmt -l .)
